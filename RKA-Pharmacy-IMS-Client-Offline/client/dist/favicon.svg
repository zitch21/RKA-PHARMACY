<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Badge Background -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#A7F3D0" stroke-width="3" stroke-opacity="0.8" />

  <!-- Pharmacy White Cross -->
  <g fill="#FFFFFF">
    <!-- Vertical Bar -->
    <rect x="106" y="52" width="44" height="126" rx="10" />
    <!-- Horizontal Bar -->
    <rect x="65" y="93" width="126" height="44" rx="10" />
  </g>

  <!-- Vital Heartbeat / Pulse Line in Dark Green -->
  <path d="M 88 115 L 112 115 L 120 91 L 134 139 L 144 115 L 168 115" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Capsule Badge with R.K.A -->
  <rect x="74" y="186" width="108" height="30" rx="15" fill="#064E3B" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="128" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">R.K.A</text>
</svg>
